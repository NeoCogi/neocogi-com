[package]
name = "neocogi-idl-example-contracts"
version = "0.0.0"
edition.workspace = true
license = "MIT"
publish = false
# Cargo owner for IDL module `neocogi.idl_example`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e69646c5f6578616d706c65"

[package.metadata.neocogi-contract]
module = "neocogi.idl_example"
source = "idl/neocogi/idl_example"

[dependencies]
neocogi-com = { workspace = true, default-features = false, features = ["alloc"] }

[build-dependencies]
neocogi-idl.workspace = true
