[package]
name = "neocogi-idl-example-consumer-contracts"
version = "0.0.0"
edition.workspace = true
license = "MIT"
publish = false
# Cargo owner for IDL module `neocogi.idl_consumer`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e69646c5f636f6e73756d6572"

[package.metadata.neocogi-contract]
module = "neocogi.idl_consumer"
source = "idl/neocogi/idl_consumer.ncidl"

[dependencies]
neocogi-com = { workspace = true }
neocogi-idl-example-contracts = { path = "../example-contracts" }

[build-dependencies]
neocogi-idl.workspace = true
