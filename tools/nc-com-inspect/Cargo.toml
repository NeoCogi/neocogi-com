[package]
name = "nc-com-inspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/neocogi/nc-com"
homepage = "https://github.com/neocogi/nc-com"
documentation = "https://docs.rs/nc-com"
readme = "README.md"
description = "Inspection CLI for nc-com plugin shared libraries"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["command-line-utilities", "development-tools::ffi"]

[dependencies]
nc-com-core = { workspace = true, default-features = false, features = ["std"] }
nc-com-runtime = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
