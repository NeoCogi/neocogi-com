[package]
name = "cargo-nc-com"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Build and assemble applications with nc-com shared components"
repository = "https://github.com/NeoCogi/microui-redux"
readme = "README.md"
keywords = ["cargo", "plugin", "cdylib", "com"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
nc-com-runtime = { path = "../../crates/com/nc-com-runtime", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3.27"
