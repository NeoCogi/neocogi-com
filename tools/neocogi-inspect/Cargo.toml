[package]
name = "neocogi-inspect"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Repository integration suites inspect sibling packages, docs and native fixtures.
# Keep them in checkout CI; archives ship local unit tests and downstream examples.
exclude = ["tests/**"]
# Checkout-only targets are registered by tests/tooling, not registry archives.
autotests = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/neocogi-inspect"
readme = "README.md"
description = "Inspection CLI for neocogi-com plugin shared libraries"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["command-line-utilities", "development-tools::ffi"]

[dependencies]
neocogi-com-core = { workspace = true, default-features = false, features = ["std"] }
neocogi-com-host = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
