[package]
name = "neocogi-com-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-platform"
homepage = "https://github.com/NeoCogi/neocogi-platform"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Process-global runtime and plugin loader for neocogi-com"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

[lib]
# One Rust/native library name is shared by direct builds and assembly roots.
name = "nc_com_shared_runtime"
crate-type = ["rlib", "cdylib"]

[dependencies]
neocogi-com-core = { workspace = true, default-features = false, features = ["std"] }

[features]
default = []
