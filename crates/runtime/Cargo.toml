[package]
name = "neocogi-com-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/neocogi-com-runtime"
readme = "README.md"
description = "Process-global runtime and plugin loader for neocogi-com"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

[lib]
# The final host links this implementation; providers use only supplied access.
name = "nc_com"
crate-type = ["rlib"]

[dependencies]
neocogi-com-core = { workspace = true, default-features = false, features = ["std"] }
