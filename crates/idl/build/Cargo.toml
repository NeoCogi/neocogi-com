[package]
name = "neocogi-idl-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-platform"
homepage = "https://github.com/NeoCogi/neocogi-platform"
description = "Cargo build integration and Rust binding generation for NeoCogi IDL modules"
keywords = ["idl", "abi", "ffi", "codegen"]
categories = ["development-tools::build-utils", "development-tools::ffi"]

[dependencies]
cc = "1"
neocogi-com-core.workspace = true
neocogi-idl.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true

[dev-dependencies]
tempfile.workspace = true
