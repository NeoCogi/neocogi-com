[package]
name = "neocogi-idl"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/foundations"
homepage = "https://github.com/NeoCogi/foundations"
description = "NeoCogi contract parsing, resolution, Rust generation, and Cargo integration"
keywords = ["idl", "abi", "ffi", "plugin"]
categories = ["development-tools::ffi", "parser-implementations"]

[dependencies]
neocogi-com-core.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit"] }

prettyplease.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
