[package]
name = "neocogi-idl"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Repository integration suites inspect sibling packages, docs and native fixtures.
# Keep them in checkout CI; archives ship local unit tests and downstream examples.
exclude = ["tests/**"]
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/neocogi-idl"
description = "NeoCogi contract parsing, resolution, Rust generation, and Cargo integration"
keywords = ["idl", "abi", "ffi", "plugin"]
categories = ["development-tools::ffi", "parser-implementations"]

[dependencies]
neocogi-com-core.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit"] }

prettyplease.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
