[package]
name = "neocogi-idl-example-contracts"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
links = "nc_contract_neocogi_idl_example"

[package.metadata.neocogi-contract]
module = "neocogi.idl_example"
source = "idl/neocogi/idl_example.ncidl"

[features]
default = ["com-validation-mangling"]
com-validation-none = ["neocogi-com/com-validation-none"]
com-validation-sha-256 = ["neocogi-com/com-validation-sha-256"]
com-validation-fnv-1a-128 = ["neocogi-com/com-validation-fnv-1a-128"]
com-validation-mangling = ["neocogi-com/com-validation-mangling"]

[dependencies]
neocogi-com = { workspace = true, default-features = false, features = ["macros"] }

[build-dependencies]
neocogi-idl-build.workspace = true
