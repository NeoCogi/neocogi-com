[package]
name = "nc-com-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/neocogi/nc-com"
homepage = "https://github.com/neocogi/nc-com"
documentation = "https://docs.rs/nc-com"
readme = "README.md"
description = "Proc macros for nc-com's portable C-ABI interface model"
keywords = ["com", "abi", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]

[lib]
proc-macro = true

[dependencies]
nc-com-core.workspace = true
proc-macro-crate.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
