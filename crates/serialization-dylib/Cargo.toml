[package]
name = "neocogi-com-serialization-dylib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Thin native plugin entry point for neocogi-com-serialization"

[lib]
crate-type = ["cdylib"]

[features]
default = []
json = ["neocogi-com-serialization/json"]

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-com-serialization = { workspace = true, features = ["plugin"] }
