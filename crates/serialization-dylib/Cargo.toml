[package]
name = "neocogi-com-serialization-dylib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Native COM serialization plugin with built-in NCB and JSON formats"

[lib]
crate-type = ["cdylib"]

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-com-serialization = { workspace = true, features = ["plugin", "json"] }
