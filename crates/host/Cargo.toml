[package]
name = "neocogi-com-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/neocogi-com-host"
readme = "README.md"
description = "Host-owned COM services, plugin registry, and native loader"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

[lib]
# The final host links this implementation; providers use only supplied access.
name = "neocogi_com_host"
crate-type = ["rlib"]

[dependencies]
neocogi-com = { workspace = true, default-features = false, features = ["std"] }

# COM callers use this host's own tables; the application supplies the codec provider.
neocogi-com-sdk = { workspace = true, default-features = false, features = ["std", "runtime"] }

[dev-dependencies]
neocogi-com-sdk = { workspace = true, features = ["macros"] }
neocogi-com-serialization = { workspace = true, features = ["plugin", "json", "std"] }
