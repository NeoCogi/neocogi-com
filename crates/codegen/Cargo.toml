[package]
name = "neocogi-com-codegen"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/foundations"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Typed Rust emission for NeoCogi COM contracts and implementation helpers"
keywords = ["com", "abi", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]



[dependencies]
neocogi-com-core.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
syn = { workspace = true, features = ["visit"] }
neocogi-idl.workspace = true
prettyplease.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde.workspace = true
