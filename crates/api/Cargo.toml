[package]
name = "neocogi-com"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Typed C-ABI COM clients, object helpers, and optional runtime bindings"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
neocogi-com-core = { workspace = true, default-features = false }
neocogi-com-macros = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
# Library-local tests explicitly retain their host implementation.
neocogi-com-runtime.workspace = true

[features]
default = ["macros", "std"]
macros = ["dep:neocogi-com-macros"]
std = ["alloc", "neocogi-com-core/std"]
alloc = ["neocogi-com-core/alloc"]
# Supplied-host service clients; this feature chooses no implementation.
runtime = ["std"]
