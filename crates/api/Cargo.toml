[package]
name = "neocogi-com"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-platform"
homepage = "https://github.com/NeoCogi/neocogi-platform"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Small C-ABI COM runtime and proc macros for Rust interfaces"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
neocogi-com-core = { workspace = true, default-features = false }
neocogi-com-macros = { workspace = true, optional = true }
neocogi-com-runtime-sys = { workspace = true, optional = true, default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "component_plugin"
crate-type = ["cdylib"]
test = false

[[example]]
name = "component_plugin_counter"
crate-type = ["cdylib"]
test = false

[[example]]
name = "component_plugin_flag"
crate-type = ["cdylib"]
test = false

[[example]]
name = "component_plugin_extra"
crate-type = ["cdylib"]
test = false

[[example]]
name = "component_plugin_metric"
crate-type = ["cdylib"]
test = false

[[example]]
name = "component_plugin_state"
crate-type = ["cdylib"]
test = false

[[example]]
name = "multi_plugin_host"
test = false
required-features = ["runtime"]

[[example]]
name = "runtime_host"
test = false
required-features = ["runtime"]

[[test]]
name = "abi_policy"
path = "integration-tests/abi_policy.rs"

[[test]]
name = "com_usage"
path = "integration-tests/com_usage.rs"
required-features = ["runtime"]

[[test]]
name = "contract_workflow"
path = "integration-tests/contract_workflow.rs"
required-features = ["runtime"]

[[test]]
name = "cross_version_component"
path = "integration-tests/cross_version_component.rs"
required-features = ["runtime"]

[[test]]
name = "native_c_abi"
path = "integration-tests/native_c_abi.rs"

[[test]]
name = "panic_behavior"
path = "integration-tests/panic_behavior.rs"

[[test]]
name = "runtime_path"
path = "integration-tests/runtime_path.rs"

[[test]]
name = "shared_library_component"
path = "integration-tests/shared_library_component.rs"
required-features = ["runtime"]

[[test]]
name = "status_contract"
path = "integration-tests/status_contract.rs"

[[test]]
name = "ui"
path = "integration-tests/ui.rs"

[dev-dependencies]
# The native-C ABI fixture runs Cargo offline from its own workspace. Keeping
# its build dependency here ensures clean test runners fetch it first.
cc = { version = "=1.2.0", default-features = false }
trybuild = "1"

[features]
default = ["macros", "std"]
macros = ["dep:neocogi-com-macros"]
std = ["alloc", "neocogi-com-core/std"]
alloc = ["neocogi-com-core/alloc"]
runtime = ["std", "dep:neocogi-com-runtime-sys"]
# Static/browser hosts own one instance of the existing runtime implementation.
static-runtime = ["runtime", "neocogi-com-runtime-sys/static-runtime"]

[[test]]
name = "recursive_interfaces"
path = "integration-tests/recursive_interfaces.rs"

[[test]]
name = "borrowed_calls"
path = "integration-tests/borrowed_calls.rs"

[[test]]
name = "plugin_assembly"
path = "integration-tests/plugin_assembly.rs"

[[test]]
name = "inheritance"
path = "integration-tests/inheritance.rs"
