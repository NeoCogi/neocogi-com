[package]
name = "neocogi-com"
version = "0.0.0"
edition = "2024"
# Repository integration suites inspect sibling packages, docs and native fixtures.
# Keep them in checkout CI; archives ship local unit tests and downstream examples.
exclude = ["integration-tests/**"]
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/foundations"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Typed C-ABI COM clients, object helpers, and optional runtime bindings"
keywords = ["com", "abi", "ffi", "plugin"]
categories = ["api-bindings", "development-tools::ffi"]

# Own the unchanged logical events module while exposing it through this facade.
# Cargo owner for IDL module `neocogi.com.events`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e636f6d2e6576656e7473"

[package.metadata.neocogi-contract]
module = "neocogi.com.events"
source = "idl/neocogi/com/events"

[build-dependencies]
neocogi-idl = { workspace = true, optional = true }

[dependencies]
neocogi-com-core = { workspace = true, default-features = false }
neocogi-com-macros = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "abi_policy"
path = "integration-tests/abi_policy.rs"

[[test]]
name = "foundation_values"
path = "integration-tests/foundation_values.rs"

[[test]]
name = "native_c_abi"
path = "integration-tests/native_c_abi.rs"

[[test]]
name = "panic_behavior"
path = "integration-tests/panic_behavior.rs"

[[test]]
name = "runtime_path"
path = "integration-tests/runtime_path.rs"

[[test]]
name = "status_contract"
path = "integration-tests/status_contract.rs"

[[test]]
name = "ui"
path = "integration-tests/ui.rs"

[dev-dependencies]
# Each test executable explicitly retains this implementation; production facade
# features never select it for unrelated host/plugin artifacts.
neocogi-com-runtime.workspace = true
# The native-C ABI fixture runs Cargo offline from its own workspace. Keeping
# its build dependency here ensures clean test runners fetch it first.
cc = { version = "=1.2.0", default-features = false }
neocogi-idl-example-contracts = { path = "../../../tools/idl/example-contracts" }
trybuild.workspace = true

[features]
default = ["macros", "std"]
macros = ["dep:neocogi-com-macros", "dep:neocogi-idl"]
std = ["alloc", "neocogi-com-core/std"]
alloc = ["neocogi-com-core/alloc"]
# Stateless typed runtime clients; linkage belongs to the final assembly.
runtime = ["std"]

[[test]]
name = "recursive_interfaces"
path = "integration-tests/recursive_interfaces.rs"

[[test]]
name = "borrowed_calls"
path = "integration-tests/borrowed_calls.rs"

[[test]]
name = "local_com"
path = "integration-tests/local_com.rs"

[[test]]
name = "inheritance"
path = "integration-tests/inheritance.rs"

[[test]]
name = "factory_plugin_runtime"
path = "integration-tests/factory_plugin_runtime.rs"
required-features = ["runtime"]

[[test]]
name = "binary_persistence"
path = "integration-tests/binary_persistence.rs"

[[test]]
name = "object_persistence"
path = "integration-tests/object_persistence.rs"
required-features = ["runtime"]

[[test]]
name = "checked_values"
path = "integration-tests/checked_values.rs"

[[test]]
name = "projection_metadata"
path = "integration-tests/projection_metadata.rs"

[[test]]
name = "weak_com"
path = "integration-tests/weak_com.rs"

[[test]]
name = "borrowed_values"
path = "integration-tests/borrowed_values.rs"

[[test]]
name = "plugin_load_failure"
path = "integration-tests/plugin_load_failure.rs"
required-features = ["runtime"]

[[test]]
name = "plugin_provenance"
path = "integration-tests/plugin_provenance.rs"
required-features = ["runtime"]

[[test]]
name = "exclusive_com"
path = "integration-tests/exclusive_com.rs"

[[test]]
name = "output_completion"
path = "integration-tests/output_completion.rs"

[[test]]
name = "output_buffers"
path = "integration-tests/output_buffers.rs"

[[test]]
name = "plugin_catalog"
path = "integration-tests/plugin_catalog.rs"
required-features = ["runtime"]
