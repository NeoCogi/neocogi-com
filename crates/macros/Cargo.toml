[package]
name = "neocogi-com-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-platform"
homepage = "https://github.com/NeoCogi/neocogi-platform"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Proc macros for neocogi-com's portable C-ABI interface model"
keywords = ["com", "abi", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]

[lib]
proc-macro = true

[features]
default = []
# Keep macro-side schema work and target-side signature generation on the same
# assembly-wide validation representation.
com-validation-none = ["neocogi-com-core/com-validation-none"]
com-validation-sha-256 = ["_com-validation-exact", "neocogi-com-core/com-validation-sha-256"]
com-validation-fnv-1a-128 = ["_com-validation-exact", "neocogi-com-core/com-validation-fnv-1a-128"]
com-validation-mangling = ["_com-validation-exact", "neocogi-com-core/com-validation-mangling"]
# Internal common gate for emitting typed contract records.
_com-validation-exact = []

[dependencies]
neocogi-com-core.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
