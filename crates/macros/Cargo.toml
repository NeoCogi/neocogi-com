[package]
name = "neocogi-com-macros"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/foundations"
documentation = "https://docs.rs/neocogi-com"
readme = "README.md"
description = "Proc macros for neocogi-com's portable C-ABI interface model"
keywords = ["com", "abi", "ffi", "proc-macro"]
categories = ["development-tools::ffi"]

[lib]
proc-macro = true


[dependencies]
neocogi-com-codegen.workspace = true
syn.workspace = true
