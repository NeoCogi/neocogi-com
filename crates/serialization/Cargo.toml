[package]
name = "neocogi-com-serialization"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Static and dynamic COM serialization plugin with NCB and lightweight JSON formats"

[lib]
crate-type = ["rlib"]

[features]
default = ["plugin"]
# NCB is unconditional, including without default features.
alloc = ["neocogi-com-sdk/alloc", "neocogi-com-sdk/macros"]
std = ["alloc", "neocogi-com-sdk/std"]
plugin = ["alloc"]
json = ["alloc"]

[dependencies]
neocogi-com-sdk.workspace = true

[dev-dependencies]
neocogi-com-sdk = { workspace = true, features = ["std", "macros"] }

[[example]]
name = "format_costs"
required-features = ["plugin"]

[[example]]
name = "array_costs"
required-features = ["plugin", "json"]
