name: COM

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: com-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compiler-spawning tests must not multiply Cargo's own build parallelism.
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1

# Four jobs total. Group Linux checks sequentially instead of expanding matrices.
jobs:
  linux:
    name: Linux SDK and native compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable quality tools and the supported compiler floor
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-src
          rustup toolchain install 1.85.0 --profile minimal
      - run: cargo fetch --locked
      - name: Qualification driver regressions
        if: ${{ !cancelled() }}
        run: cargo test -p xtask --locked
      - name: Locked workspace and independent fixture graphs
        if: ${{ !cancelled() }}
        run: cargo xtask workspace
      - name: Formatting, Clippy, feature boundaries and strict documentation
        if: ${{ !cancelled() }}
        run: cargo xtask quality
      - name: Complete workspace tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --locked
      - name: Optimized ownership and native abort checks
        if: ${{ !cancelled() }}
        run: cargo test -p neocogi-com -p neocogi-com-host --lib --release --locked -- --test-threads=1
      - name: Release native build artifacts before isolated qualification
        if: ${{ !cancelled() }}
        run: cargo clean
      - name: Rust 1.85 qualification
        if: ${{ !cancelled() }}
        run: cargo xtask msrv
      - name: Extracted crate archives and downstream consumer
        if: ${{ !cancelled() }}
        run: cargo xtask packages
      - name: Relocated Linux providers and host runtime
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite linked

  linux-safety:
    name: Linux compiler policies and safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install independent compilers, interpreter and sanitizer sources
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component miri --component rust-src
      - run: cargo fetch --locked
      - name: Independent compiler, panic, LTO and layout policies
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite build-flags
      - name: Miri ownership and raw-value checks
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite safety
      - name: AddressSanitizer across native plugin boundaries
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite address
      - name: ThreadSanitizer across native plugin boundaries
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite thread

  macos:
    name: macOS native compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo fetch --locked
      - name: Qualification driver regressions
        if: ${{ !cancelled() }}
        run: cargo test -p xtask --locked
      - name: Native linked qualification
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite linked --report "${{ runner.temp }}/com-linked-macos.json"
      - name: Native inspector argument tests
        if: ${{ !cancelled() }}
        run: cargo test -p neocogi-inspect --bin neocogi-inspect --locked
      - name: Retain native qualification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: com-linked-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/com-linked-macos.json
          if-no-files-found: error

  windows:
    name: Windows native compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo fetch --locked
      - name: Qualification driver regressions
        if: ${{ !cancelled() }}
        run: cargo test -p xtask --locked
      - name: Native linked qualification
        if: ${{ !cancelled() }}
        run: cargo xtask compatibility --suite linked --report "${{ runner.temp }}/com-linked-windows.json"
      - name: Native inspector argument tests
        if: ${{ !cancelled() }}
        run: cargo test -p neocogi-inspect --bin neocogi-inspect --locked
      - name: Retain native qualification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: com-linked-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/com-linked-windows.json
          if-no-files-found: error
