[package]
name = "neocogi-com-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Checkout integration tests and executable COM examples"

[dependencies]
# Trybuild copies dependencies independently of this package's feature forwarding.
# Every fixture uses std/macro clients; runtime remains an explicit selection.
neocogi-com = { workspace = true, features = ["std", "macros"] }

[build-dependencies]
neocogi-com-core.workspace = true
neocogi-idl.workspace = true

[dev-dependencies]
neocogi-com-core.workspace = true
# Each final executable owns the runtime it deliberately retains.
neocogi-com-runtime.workspace = true
# Fetch native fixture inputs before its separate offline Cargo build.
cc = { version = "=1.2.0", default-features = false }
trybuild.workspace = true
tempfile.workspace = true

[features]
default = ["macros", "std"]
macros = ["neocogi-com/macros"]
std = ["alloc", "neocogi-com/std"]
alloc = ["neocogi-com/alloc"]
runtime = ["std", "neocogi-com/runtime"]

[[test]]
name = "abi_policy"
path = "integration-tests/abi_policy.rs"

[[test]]
name = "com_main"
path = "integration-tests/com_main.rs"
required-features = ["macros", "std"]

[[test]]
name = "foundation_values"
path = "integration-tests/foundation_values.rs"

