[package]
name = "host-runtime-regressions"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
autotests = false

[workspace]
[dev-dependencies]
neocogi-com-host = { path = "../../../../../crates/host" }
neocogi-com-sdk = { path = "../../../../../crates/com", features = ["runtime"] }
# This standalone composition explicitly registers its selected static provider.
neocogi-com-serialization = { path = "../../../../../crates/serialization", default-features = false, features = ["std", "plugin"] }

[[test]]
name = "factory_plugin_runtime"
path = "../../support/factory_plugin_runtime_cases.rs"

[[test]]
name = "object_persistence"
path = "../../support/object_persistence_cases.rs"

[build-dependencies]
neocogi-idl = { path = "../../../../../crates/idl" }
neocogi-com = { path = "../../../../../crates/core" }
