[workspace]
resolver = "3"
# xtask stages nested workspaces under target and redirects their temporary
# files to tmp. Generated Cargo projects (including Miri's sysroot builder)
# must remain independent of every enclosing checkout or copied workspace.
exclude = ["target", "tmp", "examples/getting-started"]
members = [
    "crates/core",
    "crates/idl",
    "crates/macros",
    "crates/host",
    "crates/com",
    "tests/com",
    "tests/tooling",
    "tools/neocogi-inspect",
    "tools/xtask",
    "examples/com-plugin",
    "examples/com-host",
]

[workspace.package]
version = "0.1.0-alpha.1"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-com"

[workspace.dependencies]
neocogi-com-core = { path = "crates/core", version = "=0.1.0-alpha.1", default-features = false }
neocogi-idl = { path = "crates/idl", version = "=0.1.0-alpha.1" }
neocogi-com-macros = { path = "crates/macros", version = "=0.1.0-alpha.1", default-features = false }
neocogi-com-host = { path = "crates/host", version = "=0.1.0-alpha.1", default-features = false }
neocogi-com = { path = "crates/com", version = "=0.1.0-alpha.1", default-features = false }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
# Keep compile fixtures compatible with the declared Rust 1.85 floor.
trybuild = "=1.0.116"
