[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/idl",
    "crates/macros",
    "crates/runtime",
    "crates/api",
    "tests/com",
    "tools/neocogi-inspect",
    "examples/com-plugin",
    "examples/com-host",
]

[workspace.package]
version = "0.0.0"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NeoCogi/neocogi-com"

[workspace.dependencies]
neocogi-com-core = { path = "crates/core", version = "=0.0.0", default-features = false }
neocogi-idl = { path = "crates/idl", version = "=0.0.0" }
neocogi-com-macros = { path = "crates/macros", version = "=0.0.0", default-features = false }
neocogi-com-runtime = { path = "crates/runtime", version = "=0.0.0", default-features = false }
neocogi-com = { path = "crates/api", version = "=0.0.0", default-features = false }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
# Keep compile fixtures compatible with the declared Rust 1.85 floor.
trybuild = "=1.0.116"
